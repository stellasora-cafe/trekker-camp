name: Server deployment artifact

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate deployment source
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/master
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD origin/master
      - name: Verify deployment and release bundle
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck git-lfs
          bash scripts/check-deploy.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: web
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/stellasora-cafe/trekker-camp:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.source=https://github.com/stellasora-cafe/trekker-camp
      - uses: docker/build-push-action@v7
        id: caddy
        with:
          context: scripts/caddy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/stellasora-cafe/trekker-camp-caddy:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.source=https://github.com/stellasora-cafe/trekker-camp
      - name: Package deployment files
        env:
          WEB_IMAGE: ghcr.io/stellasora-cafe/trekker-camp@${{ steps.web.outputs.digest }}
          CADDY_IMAGE: ghcr.io/stellasora-cafe/trekker-camp-caddy@${{ steps.caddy.outputs.digest }}
        run: python3 scripts/build-server-release.py --run-id "$GITHUB_RUN_ID" --web "$WEB_IMAGE" --caddy "$CADDY_IMAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: camp-server
          path: release/camp-server.tar.gz
          if-no-files-found: error
          retention-days: 90
