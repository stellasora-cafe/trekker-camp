name: Desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - apps/update-service/**
      - apps/misskey/packages/frontend/**
      - apps/misskey/packages/frontend-shared/**
      - apps/misskey/packages/frontend-builder/**
      - apps/misskey/packages/i18n/**
      - apps/misskey/locales/zh-CN.yml
      - scripts/build-desktop-frontend.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
      - apps/misskey/packages/frontend/assets/trekker-camp/branding/**
  push:
    branches: [master]
    paths:
      - apps/desktop/**
      - apps/update-service/**
      - apps/misskey/packages/frontend/**
      - apps/misskey/packages/frontend-shared/**
      - apps/misskey/packages/frontend-builder/**
      - apps/misskey/packages/i18n/**
      - apps/misskey/locales/zh-CN.yml
      - scripts/build-desktop-frontend.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
      - apps/misskey/packages/frontend/assets/trekker-camp/branding/**

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      # JavaScript dependencies are used by host protocol tests, not bundled.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: node --test apps/update-service/worker.test.mjs
        working-directory: .
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - run: node --test scripts/prepare-release.test.mjs scripts/third-party-licenses.test.mjs scripts/package-restart.test.mjs
      - run: go tool mygo build -platform windows/amd64
      - run: go vet ./...
      - run: go tool mygo vet .
      - run: go test ./... -timeout 3m
      - uses: actions/upload-artifact@v7
        with:
          name: camp-desktop-windows-amd64
          path: apps/desktop/build/windows-amd64/
          if-no-files-found: error
