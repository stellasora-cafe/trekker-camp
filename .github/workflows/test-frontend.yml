name: Test (frontend)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - apps/misskey/packages/frontend/**
      # for permissions
      - apps/misskey/packages/misskey-js/**
      # for e2e
      - apps/misskey/packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
  pull_request:
    paths:
      - apps/misskey/packages/frontend/**
      # for permissions
      - apps/misskey/packages/misskey-js/**
      # for e2e
      - apps/misskey/packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
jobs:
  vitest:
    name: Unit tests (frontend)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.1
    - name: Use Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Check pnpm-lock.yaml
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm build
    - name: Test
      run: pnpm --filter frontend test-and-coverage
    - name: Upload Coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./apps/misskey/packages/frontend/coverage/coverage-final.json

  e2e:
    name: E2E tests (frontend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        ports:
          - 5432/tcp
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 6379/tcp

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.1
    - name: Use Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Copy Configure
      env:
        POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        REDIS_PORT: ${{ job.services.redis.ports[6379] }}
      run: |
        sed -e "s/port: 54312/port: ${POSTGRES_PORT}/" \
            -e "s/port: 56312/port: ${REDIS_PORT}/" \
            .github/misskey/test.yml > .config/test.yml
    - name: Build
      run: pnpm build
    - name: Playwright install
      working-directory: apps/misskey/packages/frontend
      run: pnpm exec playwright install --with-deps chromium
    - name: Test
      run: pnpm start-server-and-test "pnpm --filter backend start:test" http://localhost:61812 "pnpm --filter frontend test:e2e"
      timeout-minutes: 15
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-e2e-artifacts
        path: apps/misskey/packages/frontend/test/e2e/artifacts
